[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rusty"
version = "0.1.0"
description = "A comprehensive Rust-inspired type system and utility library for Python"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "n11kol11c"},
]
keywords = ["rust", "option", "result", "types", "utility", "concurrency"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/n11kol11c/rusty"
Repository = "https://github.com/n11kol11c/rusty"

[tool.setuptools.packages.find]
include = ["rusty", "rusty.*"]
